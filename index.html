<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web2APK X</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');

:root {
  --bg1: #0f0c29;
  --bg2: #302b63;
  --bg3: #24243e;
  --accent1: #7f5af0;
  --accent2: #ff8906;
  --glass: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.12);
  --text: #fffffe;
  --muted: #a7a9be;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Manrope',sans-serif; }

body {
  background: linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), #16161a);
  background-size: 400% 400%;
  animation: gradient 15s ease infinite;
  color: var(--text);
  min-height: 100vh;
  padding: 24px;
}

@keyframes gradient {
 0% {background-position: 0% 50%;}
 50% {background-position: 100% 50%;}
 100% {background-position: 0% 50%;}
}

.container { max-width: 1300px; margin: 0 auto; }

.header {
  text-align: center;
  margin-bottom: 60px;
  animation: slideDown 0.8s ease;
}

.header h1 {
  font-size: 56px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff, #7f5af0, #ff8906);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
  letter-spacing: -2px;
}

.header p { color: var(--muted); font-size: 18px; }

.grid {
  display: grid;
  grid-template-columns: 1.3fr 0.7fr;
  gap: 28px;
}

@media (max-width: 1000px) {
 .grid { grid-template-columns: 1fr; }
}

.card {
  background: var(--glass);
  backdrop-filter: blur(60px);
  padding: 32px;
  border-radius: 28px;
  border: 1px solid var(--border);
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  animation: fadeIn 1s ease;
}

.step {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.step-num {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent1), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

label {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
}

input, textarea {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  margin-bottom: 18px;
  outline: none;
  font-size: 15px;
  transition: 0.2s;
}

input:focus {
  border-color: var(--accent1);
  box-shadow: 0 0 0 4px rgba(127,90,240,0.2);
}

.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 18px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: 0.3s;
  margin-bottom: 18px;
}

.upload-zone:hover,.upload-zone.drag {
  border-color: var(--accent1);
  background: rgba(127,90,240,0.1);
}

.btn {
  width: 100%;
  padding: 18px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--accent1), var(--accent2));
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
}

.btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(127,90,240,0.4); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.phone-mock {
  background: #000;
  border-radius: 50px;
  padding: 14px;
  box-shadow: 0 40px 100px rgba(0,0,0,0.7);
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
 0%, 100% {transform: translateY(0);}
 50% {transform: translateY(-10px);}
}

.screen {
  background: #fff;
  border-radius: 36px;
  overflow: hidden;
  aspect-ratio: 9/19;
}

.screen-header {
  height: 80px;
  display: flex;
  align-items: center;
  padding: 0 28px;
  color: #fff;
  font-weight: 800;
  font-size: 20px;
}

.file-list {
  margin-top: 20px;
}

.file-item {
  background: rgba(0,0,0,0.3);
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tag {
  background: rgba(127,90,240,0.2);
  color: #a7a9be;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.success-msg {
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.3);
  padding: 14px;
  border-radius: 12px;
  color: #10b981;
  margin-bottom: 16px;
  display: none;
}

@keyframes slideDown {
  from {opacity:0; transform: translateY(-30px);}
  to {opacity:1; transform: translateY(0);}
}

@keyframes fadeIn {
  from {opacity:0;}
  to {opacity:1;}
}

.valid { border-color: #10b981!important; }
.invalid { border-color: #ef4444!important; }

@media (max-width: 1000px) {
  .header h1 { font-size: 36px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚡ Web2APK X</h1>
    <p>Turn any website into a native Android app in 30 seconds</p>
  </div>

  <div class="grid">
    <div class="card">
      <div class="step">
        <div class="step-num">1</div>
        <h3>Website Details</h3>
      </div>

      <label>Website URL</label>
      <input id="url" type="url" placeholder="https://example.com" onblur="validateURL(this)">

      <label>App Name</label>
      <input id="name" type="text" placeholder="My Awesome App" oninput="updatePreview()">

      <label>Short Name</label>
      <input id="shortName" type="text" placeholder="MyApp" maxlength="12" oninput="updatePreview()">

      <label>Description</label>
      <textarea id="desc" placeholder="What does your app do?" rows="3"></textarea>

      <div class="step">
        <div class="step-num">2</div>
        <h3>Branding</h3>
      </div>

      <label>Theme Color</label>
      <input id="color" type="color" value="#7f5af0" onchange="updatePreview()">

      <label>App Icon</label>
      <div class="upload-zone" id="dropZone">
        <input id="icon" type="file" accept="image/*" style="display:none" onchange="handleIcon(event)">
        <div id="iconPreview">
          <p style="font-size:40px">📱</p>
          <p>Drag & drop or click to upload</p>
          <p style="font-size:12px;color:var(--muted)">512x512 PNG recommended</p>
        </div>
      </div>

      <button class="btn" onclick="generate()">🚀 Generate Package</button>
      <div class="success-msg" id="success">✅ Package ready! Download below</div>
    </div>

    <div class="card">
      <div class="step">
        <div class="step-num">3</div>
        <h3>Live Preview</h3>
      </div>

      <div class="phone-mock">
        <div class="screen">
          <div class="screen-header" id="phoneHeader">MyApp</div>
          <div style="padding:24px;color:#333">
            <p style="font-weight:700;margin-bottom:12px">Your Website Loads Here</p>
            <p style="color:#666;font-size:14px">Fullscreen • Fast • No Browser UI • Offline Ready</p>
          </div>
        </div>
      </div>

      <div id="qrBox" style="text-align:center
